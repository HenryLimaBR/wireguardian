app-id: io.github.HenryLimaBR.WireGuardian
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: wireguardian
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: wireguardian
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/wireguardian /app/bin/wireguardian
      - install -Dm644 io.github.HenryLimaBR.WireGuardian.desktop /app/share/applications/io.github.HenryLimaBR.WireGuardian.desktop
      - install -Dm644 io.github.HenryLimaBR.WireGuardian.metainfo.xml /app/share/metainfo/io.github.HenryLimaBR.WireGuardian.metainfo.xml
      - install -Dm644 assets/wireguardian-icon.png /app/share/icons/hicolor/512x512/apps/io.github.HenryLimaBR.WireGuardian.png
    sources:
      - type: dir
        path: ../src
        dest: src
      - type: dir
        path: ../assets
        dest: assets
      - type: dir
        path: ../vendor
        dest: vendor
      - type: file
        path: ../Cargo.toml
      - type: file
        path: ../Cargo.lock
      - type: file
        path: ../build.rs
      - type: file
        path: cargo-config.toml
        dest: .cargo
        dest-filename: config.toml
      - type: file
        path: io.github.HenryLimaBR.WireGuardian.desktop
      - type: file
        path: io.github.HenryLimaBR.WireGuardian.metainfo.xml
